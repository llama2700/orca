name: test

on:
  push:
  workflow_dispatch:

jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r test/requirements.txt
      - name: golden model unit tests
        run: python -m pytest model/test_ref.py -q

  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install -r test/requirements.txt
      - name: unit suites (fabric, fault, eval, es)
        working-directory: test
        run: |
          for u in fabric fault eval es; do make -B UNIT=$u; done
      - name: full-chip suites (reset, serial, evolution e2e)
        working-directory: test
        run: make -B
      - name: upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-results
          path: test/sim_build/**/results.xml
          if-no-files-found: ignore

  flop-count:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: flop budget gate (behavioral reference)
        run: python3 scripts/flop_count.py --rtl-dir behav --budget 480
